name: LocalRelay checks
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run ml:parity
      - run: npm run check:challenges
      - run: npm run check:sms
      - run: npm run build
      - run: npm run check:budgets
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-test-results
          path: test-results
  corpus-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: npm ci
      - run: python -m pip install -r ml/requirements.txt
      - run: npm run check:corpus
        env:
          LOCALRELAY_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-tool-results
          path: docs/corpus-tools-checks.json
